plugins {
    id 'com.android.application'
}

// build-go.sh — обычный bash-скрипт, а на Windows своего bash в системе нет
// по умолчанию (даже если Git for Windows стоит: его bin/ не обязательно в
// PATH). Ищем bash.exe сами, вместо того чтобы полагаться на PATH.
def resolveBashExecutable() {
    if (!org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        return 'bash'
    }
    def candidates = []
    try {
        def out = ['where', 'git'].execute().text.trim()
        def gitExe = out ? out.readLines().find { it } : null
        if (gitExe) {
            def gitBinOrCmd = new File(gitExe).parentFile // .../Git/cmd или .../Git/bin — bash.exe лежит в .../Git/bin
            def gitRoot = gitBinOrCmd.parentFile
            candidates << new File(gitRoot, 'bin/bash.exe').absolutePath
            candidates << new File(gitBinOrCmd, 'bash.exe').absolutePath
        }
    } catch (Exception ignored) {
        // 'where' не нашёл git или упал — не страшно, есть запасные пути ниже
    }
    ['ProgramFiles', 'ProgramFiles(x86)', 'LOCALAPPDATA'].each { envVar ->
        def base = System.getenv(envVar)
        if (base) {
            candidates << "${base}\\Git\\bin\\bash.exe"
            candidates << "${base}\\Programs\\Git\\bin\\bash.exe"
        }
    }
    candidates << "${System.getProperty('user.home')}\\AppData\\Local\\Programs\\Git\\bin\\bash.exe"

    def found = candidates.find { it && new File(it).exists() }
    return found ?: 'bash'
}

// Go-часть собирается перед APK: серверный бинарь из assets/ уезжает на VPS
// автодеплоем, и он обязан соответствовать текущему main.go — иначе сервер
// отвечает «unknown action» на ручки, которых в нём ещё нет.
def bashExecutable = resolveBashExecutable()
tasks.register('buildGoBinaries', Exec) {
    workingDir rootProject.projectDir
    doFirst {
        // Путь к Android SDK — прямо из Gradle-проекта (local.properties пишет сама
        // Android Studio), чтобы build-go.sh не гадал, где искать NDK.
        def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (!sdkDir) {
            def lp = new File(rootProject.projectDir, 'local.properties')
            if (lp.exists()) {
                def props = new Properties()
                lp.withInputStream { props.load(it) }
                sdkDir = props.getProperty('sdk.dir')
            }
        }
        if (!sdkDir && System.getenv('LOCALAPPDATA')) {
            sdkDir = System.getenv('LOCALAPPDATA') + '\\Android\\Sdk' // стандартное место Android Studio на Windows
        }
        if (sdkDir) {
            environment 'ANDROID_HOME', sdkDir.replace('\\', '/')
            logger.lifecycle("buildGoBinaries: Android SDK = ${sdkDir}")
        }
        logger.lifecycle("buildGoBinaries: bash = ${bashExecutable}")
        if (bashExecutable == 'bash' && org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            logger.warn("buildGoBinaries: не нашёл bash.exe рядом с Git автоматически — пробую 'bash' из PATH. " +
                    "Если сборка упадёт с 'Cannot run program \"bash\"' — значит, у вас нестандартная установка Git; " +
                    "напишите, где стоит git.exe (where.exe git), подправим путь.")
        }
    }
    commandLine bashExecutable, "${rootProject.projectDir}/build-go.sh"
    inputs.file "${rootProject.projectDir}/../main.go"
    outputs.files(
            "${projectDir}/src/main/assets/server/cdn-tunnel-amd64",
            "${projectDir}/src/main/assets/server/cdn-tunnel-arm64",
            "${projectDir}/src/main/jniLibs/arm64-v8a/libtun.so")
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'buildGoBinaries' }

android {
    namespace 'com.cdn.vpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cdn.vpn'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
        debug   { minifyEnabled false }
    }

    // Extract native libs so libtun.so lands in nativeLibraryDir with exec perms.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // Keep the bundled server binaries uncompressed so AssetManager streams them raw.
    androidResources {
        noCompress += ['amd64', 'arm64']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation files('libs/t2smobile.aar')
    implementation 'com.github.mwiede:jsch:0.2.18'
}
